# NextOwner site: static pages in /public plus server functions.
[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/account.html"
  status = 200

[[redirects]]
  from = "/sell"
  to = "/sell.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
