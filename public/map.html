<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/logo-120.png">
<title>Map · NextOwner</title>
<meta name="description" content="Explore small businesses for sale across the US on a satellite map.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/nomap.css">
<style>
  :root{--accent:#0a84ff;--mglass:rgba(15,23,42,.72);--medge:rgba(255,255,255,.18)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1a24}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
  #map{position:fixed;inset:0}
  .legalfoot{display:none}
  .bar{position:fixed;z-index:600;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .row1,.row2{display:flex;gap:8px;align-items:center;pointer-events:auto}
  .glass{background:var(--mglass);border:1px solid var(--medge);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .back{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;color:#fff;text-decoration:none;font-weight:700;font-size:15px;white-space:nowrap}
  .back img{width:22px;height:22px;border-radius:6px}
  .search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;color:rgba(255,255,255,.7)}
  .search input{flex:1;min-width:0;border:0;background:transparent;color:#fff;font:inherit;font-size:15px;outline:none}
  .search input::placeholder{color:rgba(255,255,255,.6)}
  .count{margin-left:auto;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
  .row2{overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .row2::-webkit-scrollbar{display:none}
  .chip{padding:8px 14px;border-radius:999px;color:#fff;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
  .chip.on{background:var(--accent);border-color:transparent}
  select.chip{appearance:none;-webkit-appearance:none;padding-right:30px;max-width:230px;
    background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);
    background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  select.chip option{color:#0f172a}
  /* Zoom buttons sit top-right under the search bar, clear of the hosting badge at the bottom. */
  .leaflet-top.leaflet-right{margin-top:calc(108px + env(safe-area-inset-top))}
  .leaflet-control-zoom a{background:rgba(15,23,42,.8)!important;color:#fff!important;border-color:rgba(255,255,255,.2)!important}
  .fitbtn{position:fixed;z-index:600;right:10px;top:calc(196px + env(safe-area-inset-top));width:34px;height:34px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;cursor:pointer;padding:0}
  .leaflet-bottom.leaflet-right{margin-bottom:env(safe-area-inset-bottom)}
  .note{position:fixed;z-index:600;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 16px;border-radius:999px;
    font-size:14px;font-weight:600;white-space:nowrap}
  @media (max-width:560px){.back span{display:none}.count{display:none}.search{padding:9px 12px}}
</style>
</head>
<body>
<div id="map" class="nomap" aria-label="Satellite map of businesses for sale"></div>

<div class="bar">
  <div class="row1">
    <a class="back glass" href="/#browse" title="Back to listings"><img src="/logo.svg" alt=""><span>NextOwner</span></a>
    <label class="search glass">⌕ <input id="q" type="search" placeholder="Search businesses, cities or states" aria-label="Search listings"></label>
    <span class="count glass" id="count"></span>
  </div>
  <div class="row2">
    <button type="button" class="chip glass on" data-f="all">All</button>
    <select class="chip glass" id="catSel" aria-label="Business type"><option value="">All business types</option></select>
    <button type="button" class="chip glass" data-f="under100">Under $100K</button>
    <button type="button" class="chip glass" data-f="verified">Verified only</button>
    <a class="chip glass" href="/#browse" style="text-decoration:none">☰ List view</a>
  </div>
</div>
<button type="button" class="fitbtn glass" id="fit" title="Show all results" aria-label="Show all results">⤢</button>
<div class="note glass" id="note" hidden></div>

<script src="/categories.js"></script>
<script src="/auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/nomap.js"></script>
<script src="/listings-data.js"></script>
<script>
(function(){
  var esc=NOL.esc, money=NOL.money, photo=NOL.photo;
  var map=NOMap.create(document.getElementById('map'),{wheel:true,zoomPosition:'topright'});
  var items=[], marks=[], filter='all';
  NOMap.states(map,{count:function(ab){ var n=0; items.forEach(function(x,i){ if(marks[i]&&map.hasLayer(marks[i])&&/, ([A-Z]{2})$/.test(x.loc)&&RegExp.$1===ab) n++; }); return n; }});
  var q=document.getElementById('q'), catSel=document.getElementById('catSel'), countEl=document.getElementById('count'), note=document.getElementById('note');
  (window.NO_CATEGORIES||[]).forEach(function(c){ var o=document.createElement('option'); o.value=c[0]; o.textContent=c[0]; catSel.appendChild(o); });

  // Start from the homepage's search and filter, if it passed them along.
  var qs=new URLSearchParams(location.search);
  if(qs.get('q')) q.value=qs.get('q');
  if(qs.get('cat')){ catSel.value=qs.get('cat'); if(catSel.value) filter='cat:'+catSel.value; }
  else if(qs.get('f')) filter=qs.get('f');

  function popup(i){ return NOL.popupHtml(items[i]); }

  function apply(refit){
    var t=q.value.trim().toLowerCase(), n=0;
    items.forEach(function(x,i){
      var ok=true;
      if(filter.indexOf('cat:')===0) ok=(x.catKey||x.cat)===filter.slice(4);
      else if(filter==='under100') ok=x.ask<100;
      else if(filter==='verified') ok=x.v;
      if(ok&&t) ok=(x.n+' '+x.loc+' '+x.cat).toLowerCase().indexOf(t)>-1;
      NOMap.show(map,marks[i],ok); if(ok&&marks[i]) n++;
    });
    countEl.textContent=n+(n===1?' business':' businesses');
    note.hidden=n>0; note.textContent='No businesses match. Try another filter or search.';
    if(refit) NOMap.fit(map,marks,{animate:true});
    document.querySelectorAll('.chip[data-f]').forEach(function(o){ o.classList.toggle('on',o.dataset.f===filter); });
    catSel.classList.toggle('on',filter.indexOf('cat:')===0);
  }

  document.querySelectorAll('.chip[data-f]').forEach(function(c){
    c.addEventListener('click',function(){ filter=c.dataset.f; catSel.value=''; apply(true); });
  });
  catSel.addEventListener('change',function(){ filter=catSel.value?'cat:'+catSel.value:'all'; apply(true); });
  var tq=0; q.addEventListener('input',function(){ clearTimeout(tq); tq=setTimeout(function(){apply(true)},300); });
  document.getElementById('fit').addEventListener('click',function(){ NOMap.fit(map,marks,{animate:true}); });

  NOL.load().then(function(d){
    items=d.all;
    marks=NOMap.markers(map,items.map(function(x){return {lat:x.lat,lng:x.lng,label:money(x.ask),title:x.n+', asking '+money(x.ask)}}),{popup:popup});
    apply(true);
  });
})();
</script>
</body>
</html>
