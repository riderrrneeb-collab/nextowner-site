<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f3f6fb}
body{font-family:"Inter Display","Inter",-apple-system,sans-serif;-webkit-font-smoothing:antialiased;color:#0f172a}
#stage{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;background:#f3f6fb}
#bgd{position:absolute;inset:0;background:#07090e;opacity:0}
.blob{position:absolute;border-radius:50%;filter:blur(110px)}
#b1{width:900px;height:900px;left:-300px;top:-260px;opacity:.55}
#b2{width:820px;height:820px;right:-300px;bottom:-200px;opacity:.55}
#b3{width:700px;height:700px;left:190px;top:600px;opacity:0}
.layer{position:absolute;inset:0;will-change:transform,opacity,filter}
.word{display:inline-block;will-change:transform,opacity,filter}
.grad{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
#s1{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 60px}
#s1 .l{font-size:122px;font-weight:800;letter-spacing:-.05em;line-height:1.04}
.h{position:absolute;left:40px;right:40px;text-align:center;font-size:86px;font-weight:800;letter-spacing:-.045em;line-height:1.06}
.sub{position:absolute;left:60px;right:60px;text-align:center;font-size:38px;color:#5b6474;font-weight:500;letter-spacing:-.01em}
#phone{position:absolute;left:150px;top:560px;width:780px;height:1500px;border-radius:110px;background:#0b0d12;padding:22px;
  box-shadow:0 60px 140px rgba(15,23,42,.35),inset 0 0 0 3px #2a2f3a}
#screen{position:relative;width:100%;height:100%;border-radius:90px;overflow:hidden;background:#dbe5f2}
#island{position:absolute;left:50%;top:26px;width:200px;height:58px;margin-left:-100px;border-radius:40px;background:#000;z-index:5}
#maproot{position:absolute;left:-1px;top:440px;width:900px;height:600px;transform-origin:0 0}
#maproot svg path{fill:#fff;stroke:#c9d3e3;stroke-width:1.2}
.pin{position:absolute;padding:10px 18px;border-radius:999px;background:var(--a1);color:#fff;font-weight:700;font-size:30px;
  box-shadow:0 8px 20px rgba(10,132,255,.35);white-space:nowrap;transform-origin:50% 100%}
.pin::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:inherit;border-bottom:0}
#searchbar{position:absolute;left:36px;right:36px;top:120px;height:96px;border-radius:999px;background:rgba(255,255,255,.85);
  box-shadow:0 10px 30px rgba(15,23,42,.12);display:flex;align-items:center;padding:0 36px;font-size:32px;color:#5b6474;z-index:4}
#pop{position:absolute;left:40px;right:40px;bottom:60px;border-radius:44px;background:rgba(255,255,255,.94);box-shadow:0 30px 70px rgba(15,23,42,.25);overflow:hidden;z-index:4}
#pop .ph{height:250px;display:flex;align-items:center;justify-content:center;font-size:120px}
#pop .bd{padding:30px 36px 36px}
#pop b{font-size:44px;letter-spacing:-.02em}
.vb{display:inline-block;margin-left:12px;font-size:22px;font-weight:700;color:#16a34a;background:rgba(22,163,74,.12);padding:6px 12px;border-radius:999px;vertical-align:middle}
#pop .pl{color:#5b6474;font-size:28px;margin:6px 0 22px}
.nums{display:flex;gap:16px}.nums div{flex:1;background:#f1f4f9;border-radius:22px;padding:16px 18px;font-size:22px;color:#5b6474}
.nums em{display:block;font-style:normal;font-weight:700;font-size:36px;color:#0f172a;margin-top:2px}
.card{position:absolute;left:110px;width:860px;height:330px;border-radius:52px;background:rgba(255,255,255,.75);border:2px solid rgba(255,255,255,.9);
  box-shadow:0 30px 80px rgba(15,23,42,.14);display:flex;overflow:hidden}
.card .ic{width:280px;display:flex;align-items:center;justify-content:center;font-size:120px}
.card .bd{flex:1;padding:40px 44px}
.card b{display:block;font-size:44px;letter-spacing:-.025em;line-height:1.1}
.card .pl{color:#5b6474;font-size:28px;margin:6px 0 24px}
.big{position:absolute;left:60px;right:60px;top:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:132px;font-weight:800;letter-spacing:-.05em;line-height:1.02;color:#fff}
.big .grad{background:linear-gradient(90deg,#5ab0ff,#a48bff);-webkit-background-clip:text;background-clip:text;color:transparent}
#logo{position:absolute;left:50%;top:640px;width:300px;height:300px;margin-left:-150px}
#wm{position:absolute;left:0;right:0;top:1000px;text-align:center;font-size:132px;font-weight:800;letter-spacing:-.05em;color:#fff}
#tag{position:absolute;left:60px;right:60px;top:1180px;text-align:center;font-size:52px;font-weight:600;letter-spacing:-.02em;color:#c9d2e3}
#url{position:absolute;left:50%;top:1340px;padding:30px 64px;border-radius:999px;background:var(--a1);color:#fff;font-size:46px;font-weight:700;
  box-shadow:0 20px 60px rgba(10,132,255,.5);white-space:nowrap}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style></head><body><div id="stage">
<div id="bg"></div><div id="bgd"></div>
<div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div>
<div class="layer" id="s1"><div class="l" id="l1"></div><div class="l" id="l2"></div></div>
<div class="layer" id="s2">
  <div class="h" id="h2" style="top:240px"></div>
  <div id="phone"><div id="screen"><div id="island"></div>
    <div id="searchbar">⌕&nbsp;&nbsp;Search businesses, cities or states</div>
    <div id="maproot"><svg width="900" height="600" viewBox="0 0 900 600" id="usmap"></svg><div id="pins"></div></div>
    <div id="pop"><div class="ph" id="popph"></div><div class="bd"><b id="popname"></b><div class="pl" id="poppl"></div>
      <div class="nums"><div>Asking<em id="popask"></em></div><div>Revenue<em id="poprev"></em></div><div>Cash flow<em id="popcf"></em></div></div></div></div>
  </div></div>
</div>
<div class="layer" id="s3"><div class="h" id="h3" style="top:290px"></div><div class="sub" id="sub3" style="top:510px"></div><div id="cards"></div></div>
<div class="layer" id="s4"><div class="big" id="w1"><div></div></div><div class="big" id="w2"><div></div></div><div class="big" id="w3"><div></div></div></div>
<div class="layer" id="s5">
  <svg id="logo" viewBox="0 0 120 120"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs>
  <rect width="120" height="120" rx="28" fill="url(#lg)"/><path id="lp1" d="M34 88 V34 L78 82 V40" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path id="lp2" d="M66 46 L78 32 L90 46" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div id="wm"></div><div id="tag"></div><div id="url">mynextowner.com</div>
</div>
<div id="flash"></div>
</div>
<script>
// window.CFG and window.MAP are injected before this runs (see make-ad.mjs).
const C=window.CFG, M=window.MAP, T=C.timeline;
const $=id=>document.getElementById(id);
document.documentElement.style.setProperty('--a1',C.palette[0]); document.documentElement.style.setProperty('--a2',C.palette[1]);
$('b1').style.background=C.blobs[0]; $('b2').style.background=C.blobs[1]; $('b3').style.background=C.palette[0];
$('usmap').innerHTML=M.states.map(d=>`<path d="${d}"/>`).join('');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const easeOut=x=>1-Math.pow(1-x,4);
const easeOut5=x=>1-Math.pow(1-x,5);
const easeInOut=x=>x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2;
function spring(x,k=7,d=.6){ if(x<=0)return 0; if(x>=1)return 1; return 1-Math.exp(-d*k*x*1.4)*Math.cos(k*x*2.2*(1-d*.3)); }
function slam(el,t,start,dur=.38){ const p=easeOut5(prog(t,start,start+dur)); el.style.opacity=clamp(p*1.6); el.style.transform=`translateY(${(1-p)*70}px) scale(${1.25-.25*p})`; el.style.filter=`blur(${(1-p)*22}px)`; }
function reveal(el,t,start,dur=.5,dy=40,blur=20){ const p=easeOut(prog(t,start,start+dur)); el.style.opacity=p; el.style.transform=`translateY(${(1-p)*dy}px)`; el.style.filter=`blur(${(1-p)*blur}px)`; }
function out(el,p,dy=-40,blur=24,sc=.1){ el.style.opacity=1-p; el.style.filter=`blur(${p*blur}px)`; el.style.transform=`translateY(${p*dy}px) scale(${1+p*sc})`; }
// "*word*" marks a word drawn in the accent gradient.
function words(el,str){ el.innerHTML=str.split(' ').map(w=>{const g=w.startsWith('*'); return `<span class="word${g?' grad':''}">${w.replace(/\*/g,'')}</span>`;}).join(' '); return [...el.querySelectorAll('.word')]; }
const money=k=>k>=1000?'$'+(k/1000).toFixed(k%1000?1:0)+'M':'$'+k+'K';

// Content
const W1=words($('l1'),C.hook[0]), W2=words($('l2'),C.hook[1]);
$('h2').innerHTML=C.mapHead; $('h3').innerHTML=C.cardHead; $('sub3').textContent=C.cardSub;
['w1','w2','w3'].forEach((id,i)=>$(id).firstChild.innerHTML=C.words[i]);
$('tag').textContent=C.tagline;
const F=C.featured;
$('popph').textContent=F.emoji; $('popph').style.background=`linear-gradient(135deg,${F.g[0]},${F.g[1]})`;
$('popname').innerHTML=F.n+(F.v?'<span class="vb">✓ Verified</span>':''); $('poppl').textContent=F.loc+' · '+F.cat;
$('popask').textContent=money(F.ask); $('poprev').textContent=money(F.rev); $('popcf').textContent=money(F.cf);
const pinEls=C.pins.map(([city,price])=>{const d=document.createElement('div');d.className='pin';d.textContent=price;
  d.style.left=M.pts[city][0]+'px';d.style.top=M.pts[city][1]+'px';d.style.borderTopColor=C.palette[0];d.dataset.city=city;$('pins').appendChild(d);return d;});
pinEls.forEach(p=>{const w=p.offsetWidth,h=p.offsetHeight;p.style.marginLeft=(-w/2)+'px';p.style.marginTop=(-h-8)+'px';});
const featPin=pinEls.find(p=>p.dataset.city===F.city);
const cardEls=C.cards.map((c,i)=>{const d=document.createElement('div');d.className='card';d.style.top=(690+i*380)+'px';
  d.innerHTML=`<div class="ic" style="background:linear-gradient(135deg,${c.g[0]},${c.g[1]})">${c.emoji}</div><div class="bd"><b>${c.n}</b><div class="pl">${c.loc} · ${c.cat}</div><div class="nums"><div>Asking<em data-v="${c.ask}"></em></div><div>Cash flow<em data-v="${c.cf}"></em></div></div></div>`;
  $('cards').appendChild(d);return d;});
const WMs=(()=>{ $('wm').innerHTML='NextOwner'.split('').map(ch=>`<span class="word">${ch}</span>`).join(''); return [...$('wm').querySelectorAll('.word')]; })();

function render(t){
  const [c1,c2,c3,c4,end]=T;           // scene cut times
  $('b1').style.transform=`translate(${Math.sin(t*.6)*90}px,${Math.cos(t*.5)*70}px)`;
  $('b2').style.transform=`translate(${Math.cos(t*.5)*-80}px,${Math.sin(t*.45)*80}px)`;
  const dark=easeInOut(prog(t,c3-.25,c3+.2)); $('bgd').style.opacity=dark;
  $('b1').style.opacity=.55-.25*dark; $('b2').style.opacity=.55-.25*dark;
  $('b3').style.opacity=.38*easeInOut(prog(t,c4-.2,c4+1)); $('b3').style.transform=`scale(${.8+.3*easeOut(prog(t,c4,end))})`;
  // white flash on each cut (Apple-style quick dissolve punch)
  let fl=0; [c1,c2,c3].forEach(c=>{ const d=Math.abs(t-c); if(d<.12) fl=Math.max(fl,(1-d/.12)*.35); }); $('flash').style.opacity=fl*(1-dark*.7);

  // S1 hook
  const s1=$('s1'); s1.style.display=t<c1+.05?'flex':'none';
  W1.forEach((w,i)=>slam(w,t,.05+i*.09)); W2.forEach((w,i)=>slam(w,t,.45+i*.09));
  const o1=easeInOut(prog(t,c1-.22,c1)); s1.style.opacity=1-o1; s1.style.filter=`blur(${o1*26}px)`; s1.style.transform=`scale(${1+o1*.18})`;

  // S2 map
  const s2=$('s2'); s2.style.display=(t>c1-.05&&t<c2+.05)?'block':'none';
  if(t>c1-.05&&t<c2+.05){
    reveal($('h2'),t,c1+.05,.45,40,20);
    const ph=spring(prog(t,c1,c1+.75),8,.7); $('phone').style.transform=`translateY(${(1-ph)*1300}px) rotateX(${(1-ph)*16}deg)`;
    const s0=.82, z=easeInOut(prog(t,c1+1.55,c1+2.15)); const sc=s0*(1+z*1.5);
    const fx=M.pts[F.city][0], fy=M.pts[F.city][1]; const L=-1, Tp=440, sc1=s0*2.5;
    const tx1=368-L-fx*sc1, ty1=520-Tp-fy*sc1;
    $('maproot').style.transform=`translate(${tx1*z}px,${ty1*z}px) scale(${sc})`;
    const ps=s0/sc;
    pinEls.forEach((p,i)=>{const a=c1+.45+i*.065; const k=prog(t,a,a+.4); const s=spring(k,9,.5);
      p.style.opacity=clamp(k*4); p.style.transform=`translateY(${(1-s)*-50}px) scale(${(.4+.6*s)*(1/s0)*ps})`;
      const hot=p===featPin&&t>c1+1.45; p.style.background=hot?C.palette[1]:C.palette[0]; p.style.borderTopColor=hot?C.palette[1]:C.palette[0];});
    const pp=spring(prog(t,c1+1.95,c1+2.6),8,.65); $('pop').style.opacity=clamp(prog(t,c1+1.95,c1+2.1)); $('pop').style.transform=`translateY(${(1-pp)*420}px)`;
    const o2=easeInOut(prog(t,c2-.25,c2)); out(s2,o2,0,22,-.06);
  }

  // S3 cards
  const s3=$('s3'); s3.style.display=(t>c2-.05&&t<c3+.05)?'block':'none';
  if(t>c2-.05&&t<c3+.05){
    reveal($('h3'),t,c2+.02,.45,40,22); reveal($('sub3'),t,c2+.2,.45,30,14);
    s3.style.perspective='2400px';
    cardEls.forEach((c,i)=>{const a=c2+.25+i*.14; const k=prog(t,a,a+.6); const s=easeOut5(k);
      c.style.opacity=clamp(k*3); c.style.transform=`translateX(${(1-s)*760*(i%2?-1:1)}px) rotateY(${(1-s)*(i%2?28:-28)}deg) translateY(${Math.sin(t*1.6+i)*6}px)`;
      c.querySelectorAll('em').forEach(e=>{e.textContent=money(Math.round(+e.dataset.v*easeOut(prog(t,a+.25,a+1.2))));});});
    const o3=easeInOut(prog(t,c3-.25,c3)); out(s3,o3,-60,22,0);
  }

  // S4 word punches (dark)
  const s4=$('s4'); s4.style.display=(t>c3-.05&&t<c4+.05)?'block':'none';
  const step=(c4-c3)/3;
  ['w1','w2','w3'].forEach((id,i)=>{const el=$(id),a=c3+i*step; const inn=easeOut5(prog(t,a,a+.32)); const o=easeInOut(prog(t,a+step-.16,a+step));
    el.style.display=(t>a-.02&&t<a+step+.02)?'flex':'none'; el.style.opacity=inn*(1-o);
    el.style.filter=`blur(${(1-inn)*28+o*28}px)`; el.style.transform=`scale(${.82+.18*inn+o*.1})`;});

  // S5 end card
  const s5=$('s5'); s5.style.display=t>c4-.05?'block':'none';
  if(t>c4-.05){
    const Lg=spring(prog(t,c4,c4+.9),7,.55); $('logo').style.transform=`scale(${.3+.7*Lg}) rotate(${(1-Lg)*-12}deg)`; $('logo').style.opacity=clamp(prog(t,c4,c4+.2));
    const dl=easeInOut(prog(t,c4+.15,c4+.75)); ['lp1','lp2'].forEach(id=>{const p=$(id); const len=p.getTotalLength(); p.style.strokeDasharray=len; p.style.strokeDashoffset=len*(1-dl);});
    WMs.forEach((w,i)=>reveal(w,t,c4+.45+i*.035,.45,40,16));
    reveal($('tag'),t,c4+.95,.5,30,16);
    const u=spring(prog(t,c4+1.3,c4+2.1),8,.6); $('url').style.opacity=clamp(prog(t,c4+1.3,c4+1.5)); $('url').style.transform=`translateX(-50%) scale(${.6+.4*u})`;
  }
}
window.render=render; render(0);
</script></body></html>
