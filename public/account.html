<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/logo-120.png">
<title>Your account · NextOwner</title>
<link rel="stylesheet" href="/account.css">
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<nav><a class="logo" href="/">NextOwner</a><a class="nl" href="/">Browse businesses</a></nav>
<main class="wide">
  <div class="panel">
    <h1>Your account</h1>
    <p class="sub" id="who">Loading…</p>
    <div id="content"></div>
    <div class="msg" id="msg" role="status"></div>
  </div>
  <div class="panel" id="lpanel" style="margin-top:16px" hidden>
    <h1 style="font-size:24px">Your listings</h1>
    <div id="lcontent"></div>
  </div>
  <p class="foot"><button type="button" id="out">Log out</button></p>
</main>
<script src="/auth.js"></script>
<script>
(function(){
  var who=document.getElementById('who'), content=document.getElementById('content'), msg=document.getElementById('msg');
  function money(c){return '$'+(c/100).toLocaleString(undefined,{minimumFractionDigits:0})}
  function date(t){return t?new Date(t*1000).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):''}
  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

  function render(m){
    who.textContent='Signed in as '+m.email;
    var h='';
    if(m.plans.length){
      h+='<div class="plans">';
      m.plans.forEach(function(p){
        var state=p.status==='past_due'?'<span class="pill warn">Payment issue</span>'
          :p.cancel_at_period_end?'<span class="pill warn">Ends '+date(p.renews_at)+'</span>'
          :'<span class="pill ok">Active</span>';
        var line=money(p.amount)+(p.billing==='yearly'?'/year':'/month')+(p.renews_at&&!p.cancel_at_period_end?' · renews '+date(p.renews_at):'');
        h+='<div class="plan"><div><b>'+esc(p.name)+'</b><small>'+line+'</small></div>'+state+'</div>';
      });
      h+='</div>';
    } else {
      h+='<div class="empty">No active plan on this email yet. If you already paid, make sure you checked out with <b>'+esc(m.email)+'</b>.</div>';
    }
    h+='<div class="row">';
    if(m.hasBilling) h+='<button class="btn" id="portal" type="button">Manage billing and plans</button>';
    if(m.buyerPremium) h+='<a class="btn sec" href="/#picks">Open ✦ Best Picks</a>';
    else h+='<a class="btn'+(m.hasBilling?' sec':'')+'" href="/pricing">'+(m.plans.length?'Add Buyer Premium':'See plans')+'</a>';
    h+='</div>';
    content.innerHTML=h;
    var b=document.getElementById('portal');
    if(b) b.addEventListener('click',function(){
      b.disabled=true; msg.className='msg'; msg.textContent='Opening billing…';
      NO.openPortal().catch(function(e){ msg.className='msg err'; msg.textContent=e.message; b.disabled=false; });
    });
  }

  var STATUS={live:['ok','Live'],offline:['warn','Offline: add a plan to relist'],hidden:['warn','Hidden by NextOwner'],draft:['warn','Draft: not published']};
  function renderListings(d){
    var p=document.getElementById('lpanel'), c=document.getElementById('lcontent');
    var seller=!!d.bestTier||d.admin;
    p.hidden=false;
    var h='';
    if(d.listings.length){
      h+='<div class="plans">';
      d.listings.forEach(function(l){
        var st=l.status==='hidden'?STATUS.hidden:(l.status==='draft'?STATUS.draft:(l.active?STATUS.live:STATUS.offline));
        h+='<div class="plan"><div><b>'+esc(l.name)+'</b><small>'+esc(l.city+', '+l.state)+' · Asking $'+Number(l.ask).toLocaleString()+
          (l.verified?' · ✓ Verified':'')+'</small>'+
          '<small class="lact">'+(l.status==='live'&&l.active?'<a href="/?listing='+l.id+'">View</a> · ':'')+'<a href="/sell?id='+l.id+'">'+(l.status==='draft'?'Finish and publish':'Edit')+'</a></small></div>'+
          '<span class="pill '+st[0]+'">'+st[1]+'</span></div>';
      });
      h+='</div>';
    } else {
      h+='<div class="empty">You haven\'t listed a business yet.</div>';
    }
    // ID verification (Stripe Identity)
    if(seller){
      h+='<div class="plan" style="margin-top:12px"><div><b>'+(d.idVerified?'✓ ID verified':'ID verification')+'</b><small>'+
        (d.idVerified?'Your listings show the Verified badge. Checked by Stripe Identity.':
         d.verifyStatus==='processing'?'Stripe is reviewing your ID. This usually takes a few minutes.':
         'Verify your ID with Stripe Identity (photo ID + selfie) to earn the ✓ Verified badge.')+'</small></div>'+
        (d.idVerified||d.verifyStatus==='processing'?'':'<button class="btn sec" id="idgo" type="button" style="width:auto;margin:0;padding:10px 16px">Verify my ID</button>')+'</div>';
    }
    h+='<div class="row">';
    h+='<a class="btn" href="/sell">'+(d.listings.some(function(l){return l.status==='draft'})?'Continue your draft':(d.listings.length?'Add another listing':'List a business'))+'</a>';
    if(d.admin) h+='<a class="btn sec" href="/admin">Admin: review all listings</a>';
    h+='</div>';
    c.innerHTML=h;
    var go=document.getElementById('idgo');
    if(go) go.addEventListener('click',function(){
      go.disabled=true; msg.className='msg'; msg.textContent='Opening Stripe Identity…';
      NO.api('/api/verify',{method:'POST'}).then(function(r){ if(r.url) location.href=r.url; else location.reload(); })
        .catch(function(e){ go.disabled=false; msg.className='msg err'; msg.textContent=e.message; });
    });
  }

  NO.session().then(function(s){
    if(!s){ location.replace('/login?next=/account'); return; }
    var back=new URLSearchParams(location.search).get('verify');
    (back?NO.api('/api/verify').catch(function(){}):Promise.resolve()).then(function(v){
      if(v){ msg.className='msg'+(v.verified?' ok':''); msg.textContent=v.verified?'ID verified. Your listings now show the ✓ Verified badge.':
        v.status==='processing'?'Thanks! Stripe is reviewing your ID. Your badge appears automatically once it\'s approved.':
        v.status==='requires_input'?'The ID check wasn\'t finished'+(v.error?' ('+v.error.replace(/_/g,' ')+')':'')+'. You can try again below.':''; }
      return NO.api('/api/my-listings').then(renderListings);
    }).catch(function(){});
    return NO.membership(true).then(function(m){
      if(!m){ who.textContent='Signed in as '+s.user.email; msg.className='msg err'; msg.textContent='Could not load your plans. Refresh to try again.'; return; }
      render(m);
    });
  });
  document.getElementById('out').addEventListener('click',function(){ NO.signOut().then(function(){ location.href='/'; }); });
})();
</script>
</body>
</html>
