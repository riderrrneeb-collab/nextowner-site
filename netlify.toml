# NextOwner site: static pages plus a few server functions.
[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/account.html"
  status = 200
